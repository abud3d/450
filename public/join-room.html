<h1>دخول غرفة</h1>
<p class="service-intro">لديك رمز غرفة؟ أدخله للانضمام إلى أصحابك. أو ادخل سريعاً ليبحث لك النظام عن أقرب غرفة متاحة.</p>
<form id="joinForm" class="service-form">
<label>اسم اللاعب<input id="playerName" maxlength="24" required placeholder="اسمك على الطاولة"></label>
<label>رمز الغرفة<input id="roomCode" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="رمز الغرفة — 4 أرقام"></label>
<button class="primary-action" type="submit">دخول الغرفة بالرمز</button>
<button id="quickJoin" class="secondary" type="button">دخول سريع — ابحث عن غرفة</button>

</form>
