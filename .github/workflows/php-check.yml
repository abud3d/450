name: PHP checks
on:
  push:
    branches: [main, php-native-engine]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BALOUT_DB_DSN: mysql:host=127.0.0.1;dbname=baloot_test;charset=utf8mb4
      BALOUT_DB_USER: root
      BALOUT_DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: baloot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring
      - name: Lint all PHP files
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run PHP game engine tests
        run: php test-php/game-engine-test.php
      - name: Run PHP purchase engine tests
        run: php test-php/purchase-engine-test.php
      - name: Run PHP room engine tests
        run: php test-php/engine-room-test.php
      - name: Run complete four-player match simulation
        run: php test-php/full-match-test.php
      - name: Run JavaScript reference parity fixtures
        run: php test-php/rules-parity-test.php
      - name: Apply MySQL schema
        run: mysql --protocol=TCP -h127.0.0.1 -uroot -proot baloot_test < database/schema.mysql.sql
      - name: Run MySQL room store integration tests
        run: php test-php/mysql-room-store-test.php
      - name: Run four-browser room HTTP and recovery tests
        run: bash test-php/room-http-test.sh
      - name: Run concurrent MySQL mutation tests
        run: php test-php/concurrency-room-test.php
      - name: Run PHP account and mail HTTP integration tests
        run: bash test-php/auth-http-test.sh
