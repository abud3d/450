name: Node game checks
on:
  push:
    paths: [ 'server.js', 'game/**', 'public/**', 'test/**', 'package.json', '.github/workflows/node-check.yml' ]
  pull_request:
    paths: [ 'server.js', 'game/**', 'public/**', 'test/**', 'package.json', '.github/workflows/node-check.yml' ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
